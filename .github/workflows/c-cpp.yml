name: CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/RU1N-GOD/android_kernel_samsung_g611f
          kernel-branch: main
          config: on7xreflte_01_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 9
          aosp-clang-version: r383902
